<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>金烽音乐餐厅 - 管理系统</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #f5f5f5; color: #333;
    padding-bottom: 60px;
  }

  /* 顶部标题栏 */
  .top-bar {
    background: linear-gradient(135deg, #ff6b35, #f72c25);
    color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: 0; z-index: 100;
  }
  .top-bar h1 { font-size: 18px; }
  .top-bar .user-info { font-size: 13px; display: flex; align-items: center; gap: 8px; }
  .logout-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 5px 10px; border-radius: 15px; font-size: 12px; }

  /* 顶部导航卡片 */
  .page-nav {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
    padding: 15px; background: white; margin-bottom: 10px;
  }
  .nav-card {
    text-align: center; padding: 15px 5px; border-radius: 10px; cursor: pointer;
    background: #fff5f0;
  }
  .nav-card.active { background: linear-gradient(135deg, #ff6b35, #f72c25); color: white; }
  .nav-icon { font-size: 26px; margin-bottom: 5px; }
  .nav-label { font-size: 12px; }

  /* 页面切换 */
  .page { display: none; padding: 10px; }
  .page.active { display: block; }

  /* 卡片 */
  .card {
    background: white; border-radius: 12px; padding: 15px; margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }

  /* 统计数据 */
  .stats-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
  }
  .stat-card {
    background: linear-gradient(135deg, #fff5f0, #ffe0d0);
    border-radius: 10px; padding: 15px; text-align: center;
  }
  .stat-card.green { background: linear-gradient(135deg, #f0fff0, #d0ffd0); }
  .stat-card.blue { background: linear-gradient(135deg, #f0f5ff, #d0e0ff); }
  .stat-card.purple { background: linear-gradient(135deg, #fff0ff, #ffd0ff); }
  .stat-value { font-size: 24px; font-weight: bold; color: #ff6b35; margin-bottom: 5px; }
  .stat-card.green .stat-value { color: #2e7d32; }
  .stat-card.blue .stat-value { color: #1565c0; }
  .stat-card.purple .stat-value { color: #7b1fa2; }
  .stat-label { font-size: 12px; color: #666; }

  /* 桌台网格 */
  .table-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
  }
  .table-card {
    background: white; border-radius: 10px; padding: 15px 10px; text-align: center;
    cursor: pointer; border: 2px solid #e0e0e0; transition: all 0.2s;
    position: relative;
  }
  .table-card:active { transform: scale(0.95); }
  .table-card.idle { border-color: #4caf50; background: #f1f8e9; }
  .table-card.using { border-color: #ff6b35; background: #fff3e0; }
  .table-card.reserved { border-color: #ff9800; background: #fff8e1; }
  .table-card.cleaning { border-color: #9e9e9e; background: #f5f5f5; }
  .table-icon { font-size: 28px; margin-bottom: 5px; }
  .table-name { font-size: 13px; font-weight: bold; margin-bottom: 3px; }
  .table-info { font-size: 11px; color: #666; }
  .table-amount {
    position: absolute; top: 5px; right: 5px;
    font-size: 11px; font-weight: bold; color: #ff6b35;
    background: rgba(255,255,255,0.8); padding: 2px 6px; border-radius: 8px;
  }

  /* 分类筛选 */
  .cat-tabs {
    display: flex; overflow-x: auto; gap: 8px; padding: 10px 0;
    scrollbar-width: none;
  }
  .cat-tabs::-webkit-scrollbar { display: none; }
  .cat-tab {
    flex-shrink: 0; padding: 8px 16px; border-radius: 20px;
    background: #f0f0f0; font-size: 13px; cursor: pointer;
  }
  .cat-tab.active { background: #ff6b35; color: white; }

  /* 菜品网格 */
  .menu-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
  }
  .menu-item {
    background: white; border-radius: 10px; padding: 10px;
    display: flex; gap: 10px; border: 1px solid #eee;
  }
  .menu-img {
    width: 60px; height: 60px; border-radius: 8px;
    background: linear-gradient(135deg, #ff6b35, #ff9500);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; flex-shrink: 0;
  }
  .menu-info { flex: 1; min-width: 0; }
  .menu-name { font-size: 14px; font-weight: bold; margin-bottom: 3px; }
  .menu-price { font-size: 14px; color: #ff6b35; font-weight: bold; }
  .menu-add {
    width: 30px; height: 30px; border-radius: 50%;
    background: #ff6b35; color: white; border: none;
    font-size: 20px; line-height: 1; align-self: center; cursor: pointer;
  }

  /* 购物车/订单详情 */
  .cart-bar {
    position: fixed; bottom: 60px; left: 10px; right: 10px;
    background: linear-gradient(135deg, #ff6b35, #f72c25);
    color: white; padding: 12px 15px; border-radius: 50px;
    display: flex; justify-content: space-between; align-items: center;
    z-index: 50; box-shadow: 0 4px 20px rgba(255, 107, 53, 0.4);
  }
  .cart-info { font-size: 14px; }
  .cart-count {
    display: inline-block; background: white; color: #ff6b35;
    width: 22px; height: 22px; border-radius: 50%;
    text-align: center; line-height: 22px; font-weight: bold;
    margin-right: 8px; font-size: 12px;
  }
  .cart-total { font-size: 18px; font-weight: bold; }
  .cart-btn {
    background: white; color: #ff6b35; border: none;
    padding: 8px 20px; border-radius: 20px; font-weight: bold; font-size: 14px;
  }

  /* 列表 */
  .list-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; border-bottom: 1px solid #f0f0f0;
  }
  .list-item:last-child { border-bottom: none; }
  .list-left { flex: 1; }
  .list-title { font-size: 15px; font-weight: 500; margin-bottom: 3px; }
  .list-sub { font-size: 12px; color: #888; }
  .list-right { text-align: right; }
  .list-amount { font-size: 16px; font-weight: bold; color: #ff6b35; }
  .list-status { font-size: 11px; padding: 2px 8px; border-radius: 10px; display: inline-block; }

  /* 按钮 */
  .btn {
    padding: 8px 16px; border: none; border-radius: 8px;
    font-size: 13px; cursor: pointer;
  }
  .btn-primary { background: #ff6b35; color: white; }
  .btn-green { background: #4caf50; color: white; }
  .btn-danger { background: #f44336; color: white; }
  .btn-gray { background: #e0e0e0; color: #333; }
  .btn-block { width: 100%; padding: 12px; font-size: 15px; }

  /* 弹窗 */
  .modal-mask {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5); z-index: 1000;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .modal {
    background: white; border-radius: 20px 20px 0 0;
    width: 100%; max-height: 85vh; overflow-y: auto;
    padding: 20px; padding-bottom: 30px;
  }
  .modal-title {
    font-size: 18px; font-weight: bold; margin-bottom: 15px;
    text-align: center;
  }
  .form-group { margin-bottom: 12px; }
  .form-group label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 10px 12px; border: 1px solid #ddd;
    border-radius: 8px; font-size: 14px; outline: none;
  }
  .form-group input:focus, .form-group select:focus { border-color: #ff6b35; }
  .form-row { display: flex; gap: 10px; }
  .form-row .form-group { flex: 1; }

  /* 底部导航 */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: white; border-top: 1px solid #eee;
    display: flex; justify-content: space-around; padding: 6px 0;
    z-index: 100;
  }
  .bottom-nav-item {
    text-align: center; font-size: 10px; color: #999;
    cursor: pointer; flex: 1; padding: 4px;
  }
  .bottom-nav-item.active { color: #ff6b35; }
  .bottom-nav-icon { font-size: 20px; margin-bottom: 2px; }

  /* 登录页 */
  .login-page {
    min-height: 100vh;
    background: linear-gradient(135deg, #ff6b35 0%, #f72c25 50%, #9d0208 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 30px;
  }
  .login-logo { font-size: 60px; margin-bottom: 10px; }
  .login-title { font-size: 28px; font-weight: bold; color: white; margin-bottom: 5px; }
  .login-subtitle { color: rgba(255,255,255,0.7); margin-bottom: 40px; font-size: 14px; }
  .login-box {
    background: white; border-radius: 20px; padding: 30px;
    width: 100%; max-width: 360px; box-shadow: 0 10px 40px rgba(0,0,0,0.2);
  }
  .login-box h2 { text-align: center; margin-bottom: 20px; color: #ff6b35; }

  /* 搜索框 */
  .search-box {
    display: flex; gap: 8px; margin-bottom: 10px;
  }
  .search-box input {
    flex: 1; padding: 10px 15px; border: 1px solid #ddd;
    border-radius: 25px; font-size: 14px; outline: none;
  }

  /* 数量加减 */
  .qty-control {
    display: flex; align-items: center; gap: 10px;
  }
  .qty-btn {
    width: 28px; height: 28px; border-radius: 50%;
    border: 1px solid #ff6b35; background: white; color: #ff6b35;
    font-size: 16px; cursor: pointer;
  }
  .qty-num { font-size: 16px; font-weight: bold; min-width: 20px; text-align: center; }

  /* 标签 */
  .tag {
    display: inline-block; padding: 3px 8px; border-radius: 4px;
    font-size: 11px; margin-right: 5px;
  }
  .tag-green { background: #e8f5e9; color: #2e7d32; }
  .tag-red { background: #ffebee; color: #c62828; }
  .tag-orange { background: #fff3e0; color: #e65100; }
  .tag-blue { background: #e3f2fd; color: #1565c0; }

  /* 会员等级 */
  .member-level.gold { color: #ffd700; }
  .member-level.silver { color: #c0c0c0; }
  .member-level.normal { color: #999; }

  /* 空状态 */
  .empty {
    text-align: center; color: #999; padding: 40px 20px; font-size: 14px;
  }
</style>
</head>
<body>

<!-- 登录页 -->
<div id="login-page" class="login-page" style="display:none;">
  <div class="login-logo">🎵</div>
  <div class="login-title">金烽音乐餐厅</div>
  <div class="login-subtitle">烧烤 · KTV · 音乐 · 美酒</div>
  <div class="login-box">
    <h2>员工登录</h2>
    <div class="form-group">
      <label>账号</label>
      <input id="login-username" placeholder="请输入账号" value="admin">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input id="login-password" type="password" placeholder="请输入密码" value="123456">
    </div>
    <button class="btn btn-primary btn-block" onclick="doLogin()" style="margin-top:10px;">登 录</button>
  </div>
</div>

<!-- 主界面 -->
<div id="main-app" style="display:none;">
  <div class="top-bar">
    <h1>🎵 金烽音乐餐厅</h1>
    <div class="user-info">
      <span id="top-username">admin</span>
      <button class="logout-btn" onclick="doLogout()">退出</button>

  </div>

  <!-- 快捷导航 -->
  <div class="page-nav">
    <div class="nav-card active" onclick="switchPage('tables')">
      <div class="nav-icon">🍽️</div>
      <div class="nav-label">点餐收银</div>
    </div>
    <div class="nav-card" onclick="switchPage('orders')">
      <div class="nav-icon">📋</div>
      <div class="nav-label">订单管理</div>
    </div>
    <div class="nav-card" onclick="switchPage('members')">
      <div class="nav-icon">💳</div>
      <div class="nav-label">会员管理</div>
    </div>
    <div class="nav-card" onclick="switchPage('stats')">
      <div class="nav-icon">📊</div>
      <div class="nav-label">数据统计</div>
    </div>
    <div class="nav-card" onclick="switchPage('menu')">
      <div class="nav-icon">🍖</div>
      <div class="nav-label">菜品管理</div>
    </div>
    <div class="nav-card" onclick="switchPage('tables-setting')">
      <div class="nav-icon">🪑</div>
      <div class="nav-label">桌台设置</div>
    </div>
    <div class="nav-card" onclick="switchPage('ktv')">
      <div class="nav-icon">🎤</div>
      <div class="nav-label">KTV计时</div>
    </div>
    <div class="nav-card" onclick="switchPage('settings')">
      <div class="nav-icon">⚙️</div>
      <div class="nav-label">系统设置</div>
    </div>
  </div>

  <!-- 1. 点餐收银 -->
  <div id="page-tables" class="page active">
    <div class="card" style="padding-bottom: 5px;">
      <div style="font-size: 16px; font-weight: bold; margin-bottom: 10px;">🏠 桌台状态</div>

  <!-- 5. 菜品管理 -->

  <!-- 7. KTV计时 -->

  <!-- 8. 系统设置 -->

          <label>员工折扣</label>

        </div>
      </div>
      <button class="btn btn-primary btn-block" onclick="saveSettings()">保存设置</button>

    <div class="card">
      <div style="font-size: 16px; font-weight: bold; margin-bottom: 15px;">👤 账号管理</div>
      <div id="staff-list"></div>
      <button class="btn btn-gray btn-block" style="margin-top:10px;" onclick="showStaffModal()">+ 新增员工账号</button>
    </div>
  </div>
</div>

<script>
// ========== Supabase 配置 ==========
const SUPABASE_URL = 'https://ztymkrkfiroqodahxueg.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp0eW1rcmtmaXJvcW9kYWh4dWVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MjM3NzQ4OTAsImV4cCI6MjAzOTM1MDg5MH0.abcdefghijklmnopqrstuvwxyz1234567890'; // 占位，实际会被替换

// 先用 localStorage 模式，后续可切换到真实 Supabase
const USE_SUPABASE = false;

const DB = {
  // 从 localStorage 读取
  get(key, def) {
    try {
      return JSON.parse(localStorage.getItem('jinfeng_' + key)) || def;
    } catch(e) { return def; }
  },
  set(key, val) {
    localStorage.setItem('jinfeng_' + key, JSON.stringify(val));
  },
  // 获取自增ID
  nextId(list) {
    return list.length ? Math.max(...list.map(i => i.id)) + 1 : 1;
  }
};

// ========== 1. 桌台/点餐 ==========
function renderTables() {
  const tables = DB.get('tables', []);
  const orders = DB.get('orders', []);

  const grid = document.getElementById('table-grid');
  grid.innerHTML = tables.map(t => {
    const order = orders.find(o => o.table_id === t.id && o.status === 'dining');
    let icon = '🍽️';
    if (t.type === 'ktv') icon = '🎤';
    let amountText = '';
    if (order) {
      const total = order.items.reduce((s, i) => s + i.price * i.quantity, 0);
      amountText = `<div class="table-amount">¥${total.toFixed(0)}</div>`;
    }
    const statusText = {
      idle: '空闲', using: '使用中', reserved: '已预订', cleaning: '清扫中'
    }[t.status] || t.status;
    return `
      <div class="table-card ${t.status}" onclick="openTable(${t.id})">
        ${amountText}
        <div class="table-icon">${icon}</div>
        <div class="table-name">${t.name}</div>
        <div class="table-info">${t.max_people}人 · ${statusText}</div>
      </div>
    `;
  }).join('');
}

function openTable(tableId) {
  const tables = DB.get('tables', []);
  const table = tables.find(t => t.id === tableId);
  if (!table) return;

  const orders = DB.get('orders', []);
  let order = orders.find(o => o.table_id === tableId && o.status === 'dining');

  if (!order) {
    // 开新单
    const count = orders.length + 1;
    const orderNo = 'D' + new Date().toISOString().slice(2,10).replace(/-/g,'') + String(count).padStart(4, '0');
    order = {
      id: DB.nextId(orders),
      order_no: orderNo,
      table_id: tableId,
      table_name: table.name,
      customer_count: 1,
      items: [],
      total_amount: 0,
      status: 'dining',
      staff_id: currentUser.id,
      staff_name: currentUser.real_name,
      ktv_start_time: table.type === 'ktv' ? new Date().toISOString() : null,
      ktv_fee: 0,
      created_at: new Date().toISOString()
    };
    // 更新桌台状态
    table.status = 'using';
    DB.set('tables', tables);
    orders.push(order);
    DB.set('orders', orders);
  }

  currentOrder = order;
  currentTableId = tableId;
  currentCat = 1;
  showOrderModal();
}

function getCatIcon(catId) {
  const cats = DB.get('categories', []);
  const cat = cats.find(c => c.id === catId);
  return cat ? cat.icon : '🍽️';
}

function increaseItem(itemId) {
  const items = DB.get('menu_items', []);
  const item = items.find(i => i.id === itemId);
  if (!item) return;

  const oi = currentOrder.items.find(o => o.item_id === itemId);
  if (oi) {
    oi.quantity++;
    oi.amount = oi.price * oi.quantity;
  } else {
    currentOrder.items.push({
      id: Date.now(),
      item_id: item.id,
      item_name: item.name,
      price: item.price,
      quantity: 1,
      amount: item.price
    });
  }
  saveCurrentOrder();
  showOrderModal(); // 刷新
}

function decreaseItem(itemId) {
  const idx = currentOrder.items.findIndex(o => o.item_id === itemId);
  if (idx === -1) return;
  currentOrder.items[idx].quantity--;
  if (currentOrder.items[idx].quantity <= 0) {
    currentOrder.items.splice(idx, 1);
  } else {
    currentOrder.items[idx].amount = currentOrder.items[idx].price * currentOrder.items[idx].quantity;
  }
  saveCurrentOrder();
  showOrderModal();
}

function calcOrderTotal() {
  const foodTotal = currentOrder.items.reduce((s, i) => s + i.amount, 0);
  let ktvFee = 0;
  // KTV 费用
  const table = DB.get('tables', []).find(t => t.id === currentOrder.table_id);
  if (table?.has_ktv && currentOrder.ktv_start_time) {
    const hours = (Date.now() - new Date(currentOrder.ktv_start_time)) / 3600000;
    const minHours = Math.ceil(hours);
    ktvFee = minHours * (table.ktv_fee || 50);
  }
  return foodTotal + ktvFee;
}

function saveCurrentOrder() {
  const orders = DB.get('orders', []);
  const idx = orders.findIndex(o => o.id === currentOrder.id);
  currentOrder.total_amount = calcOrderTotal();
  if (idx > -1) orders[idx] = currentOrder;
  else orders.push(currentOrder);
  DB.set('orders', orders);
}

function closeOrderModal() {
  document.getElementById('order-modal').innerHTML = '';
  renderTables();
}

// ========== 结账 ==========
function checkoutOrder() {
  const order = currentOrder;
  if (order.items.length === 0) {
    alert('还没点任何菜品！');
    return;
  }
  if (!confirm(`确认结账？\n\n桌台：${order.table_name}\n合计：¥${order.total_amount.toFixed(2)}`)) return;

  const orders = DB.get('orders', []);
  const idx = orders.findIndex(o => o.id === order.id);
  const total = order.total_amount;

  orders[idx].status = 'settled';
  orders[idx].settled_at = new Date().toISOString();
  orders[idx].actual_amount = total;
  orders[idx].paid_amount = total;
  DB.set('orders', orders);

  // 更新桌台状态
  const tables = DB.get('tables', []);
  const t = tables.find(t => t.id === order.table_id);
  if (t) { t.status = 'cleaning'; DB.set('tables', tables); }

  alert(`✅ 结账成功！\n\n实收：¥${total.toFixed(2)}`);
  closeOrderModal();
}

function cancelOrder(id) {
  if (!confirm('确定作废此订单？')) return;
  const orders = DB.get('orders', []);
  const order = orders.find(o => o.id === id);
  if (!order) return;
  order.status = 'canceled';
  DB.set('orders', orders);
  // 释放桌台
  if (order.table_id) {
    const tables = DB.get('tables', []);
    const t = tables.find(t => t.id === order.table_id);
    if (t) { t.status = 'idle'; DB.set('tables', tables); }
  }
  renderOrders();
  alert('已作废');
}

  DB.set('members', members);
  renderMembers();
  alert(`充值成功！\n\n充值：¥${amount}\n余额：¥${m.balance.toFixed(2)}`);
}

// ========== 4. 数据统计 ==========
function renderStats() {
  const orders = DB.get('orders', []);
  const settledOrders = orders.filter(o => o.status === 'settled');
  const today = new Date().toDateString();
  const todayOrders = settledOrders.filter(o => new Date(o.settled_at).toDateString() === today);
  const todayAmount = todayOrders.reduce((s, o) => s + o.actual_amount, 0);
  const todayPeople = todayOrders.reduce((s, o) => s + (o.customer_count || 0), 0);

  document.getElementById('stat-today-amount').textContent = '¥' + todayAmount.toFixed(0);
  document.getElementById('stat-today-orders').textContent = todayOrders.length;
  document.getElementById('stat-today-people').textContent = todayPeople;
  document.getElementById('stat-today-avg').textContent = '¥' + (todayOrders.length ? (todayAmount / todayOrders.length).toFixed(0) : 0);

  const totalAmount = settledOrders.reduce((s, o) => s + o.actual_amount, 0);
  document.getElementById('stat-total-orders').textContent = settledOrders.length;
  document.getElementById('stat-total-amount').textContent = '¥' + totalAmount.toFixed(0);
  document.getElementById('stat-member-count').textContent = DB.get('members', []).length;
  document.getElementById('stat-total-recharge').textContent = '¥' + DB.get('members', []).reduce((s, m) => s + m.balance, 0).toFixed(0);

  // 热销TOP5
  const dishCount = {};
  settledOrders.forEach(o => {
    o.items.forEach(i => {
      dishCount[i.item_name] = (dishCount[i.item_name] || 0) + i.quantity;
    });
  });
  const top5 = Object.entries(dishCount)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 5);

  const topEl = document.getElementById('top-dishes');
  if (!top5.length) {
    topEl.innerHTML = '<div class="empty">暂无销售数据</div>';
  } else {
    topEl.innerHTML = top5.map(([name, qty], i) => `
      <div class="list-item">
        <div class="list-left" style="display:flex; align-items:center; gap:10px;">
          <div style="width:24px; height:24px; border-radius:50%; background:${i===0?'#ffd700':i===1?'#c0c0c0':i===2?'#cd7f32':'#e0e0e0'}; color:${i<3?'white':'#666'}; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:bold;">${i+1}</div>
          <span>${name}</span>
        </div>
        <div class="list-right">
          <div style="color:#ff6b35; font-weight:bold;">${qty} 份</div>
        </div>
      </div>
    `).join('');
  }
}

function renderKtv() {

  list.innerHTML = tables.map(t => {

    let timeText = '空闲';
    let feeText = '';
    if (order?.ktv_start_time) {
      const diff = Date.now() - new Date(order.ktv_start_time);
      const hours = diff / 3600000;
      const h = Math.floor(hours);
      const m = Math.floor((diff % 3600000) / 60000);
      timeText = `${h}小时${m}分钟`;
      feeText = `¥${(Math.ceil(hours) * t.ktv_fee).toFixed(0)}`;
    }
    return `
      <div class="list-item">
        <div class="list-left">
          <div class="list-title">🎤 ${t.name}</div>
          <div class="list-sub">${timeText} · ¥${t.ktv_fee}/时</div>
        </div>
        <div class="list-right">
          <div class="list-amount">${feeText}</div>
          <div style="font-size:11px; color:#666; margin-top:3px;">${order ? '使用中' : '空闲'}</div>
        </div>
      </div>
    `;
  }).join('');
}

  const users = DB.get('users', []);
  if (users.find(u => u.username === username)) { alert('账号已存在'); return; }

  users.push({ id: DB.nextId(users), username, password, real_name, role });
  DB.set('users', users);
  document.getElementById('staff-modal').innerHTML = '';
  renderSettings();
  alert('添加成功');
}

function delStaff(id) {
  if (!confirm('确定删除此账号？')) return;
  const users = DB.get('users', []).filter(u => u.id !== id);
  DB.set('users', users);
  renderSettings();
}

// ========== 启动 ==========
initData();

// 检查登录状态
const savedUser = DB.get('current_user', null);
if (savedUser) {
  currentUser = savedUser;
  showApp();
} else {
  document.getElementById('login-page').style.display = 'flex';
}

// KTV页面每秒刷新
setInterval(() => {
  if (currentPage === 'ktv') renderKtv();
}, 1000 * 60); // 每分钟刷新
</script>
