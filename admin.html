<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>金烽音乐餐吧 - 管理系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#f5f5f5;color:#333;font-size:14px;}

/* 登录页 */
.login-page{min-height:100vh;background:linear-gradient(135deg,#ff6b35 0%,#f72c25 40%,#9d0208 100%);display:flex;align-items:center;justify-content:center;padding:20px;}
.login-box{background:#fff;border-radius:20px;padding:30px 25px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,0.3);}
.login-logo{text-align:center;margin-bottom:20px;}
.login-logo-icon{font-size:50px;margin-bottom:10px;}
.login-title{font-size:22px;font-weight:bold;color:#d32f2f;margin-bottom:5px;}
.login-sub{font-size:13px;color:#888;}
.form-group{margin-bottom:15px;}
.form-label{font-size:13px;color:#555;margin-bottom:6px;display:block;}
.form-input{width:100%;padding:12px 15px;border:1px solid #ddd;border-radius:10px;font-size:14px;outline:none;transition:border 0.3s;}
.form-input:focus{border-color:#ff6b35;}
.btn{width:100%;padding:13px;border:none;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer;}
.btn-primary{background:linear-gradient(135deg,#ff6b35,#f72c25);color:#fff;}
.btn-warn{background:#ff9800;color:#fff;padding:8px 14px;font-size:13px;width:auto;border-radius:8px;}
.btn-success{background:#4caf50;color:#fff;}
.btn-danger{background:#f44336;color:#fff;padding:8px 14px;font-size:13px;width:auto;border-radius:8px;}
.btn-outline{background:#fff;color:#666;border:1px solid #ddd;padding:8px 14px;font-size:13px;width:auto;border-radius:8px;}
.btn-small{padding:6px 12px;font-size:12px;width:auto;border-radius:6px;}

/* 主框架 */
.app{display:flex;min-height:100vh;}
.sidebar{width:200px;background:linear-gradient(180deg,#1a0f05,#2d1810);color:#fff;padding:15px 0;position:fixed;top:0;left:0;bottom:0;overflow-y:auto;z-index:100;}
.sidebar-logo{padding:15px 20px 20px;border-bottom:1px solid rgba(255,255,255,0.1);}
.sidebar-logo h2{font-size:16px;color:#ffcc80;}
.sidebar-logo p{font-size:11px;color:#888;margin-top:3px;}
.menu-item{padding:12px 20px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:10px;transition:all 0.2s;}
.menu-item:hover{background:rgba(255,107,53,0.1);}
.menu-item.active{background:linear-gradient(90deg,rgba(255,107,53,0.3),transparent);border-left:3px solid #ff6b35;color:#ffcc80;}
.menu-icon{font-size:18px;width:20px;text-align:center;}

.main{flex:1;margin-left:200px;}
.topbar{background:#fff;padding:15px 25px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,0.05);position:sticky;top:0;z-index:50;}
.topbar-title{font-size:18px;font-weight:bold;color:#333;}
.topbar-user{font-size:13px;color:#666;}
.topbar-user span{margin-left:10px;cursor:pointer;color:#ff6b35;}

.content{padding:20px 25px;}
.page{display:none;}
.page.active{display:block;}

/* 卡片 */
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,0.05);}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;}
.card-title{font-size:16px;font-weight:bold;}

/* 数据统计卡片 */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px;}
.stat-card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,0.05);}
.stat-label{font-size:13px;color:#888;margin-bottom:8px;}
.stat-value{font-size:26px;font-weight:bold;color:#d32f2f;}
.stat-unit{font-size:13px;color:#888;margin-left:3px;font-weight:normal;}
.stat-icon{float:right;font-size:30px;opacity:0.3;}

/* 表格 */
.table{width:100%;border-collapse:collapse;}
.table th,.table td{padding:12px;text-align:left;border-bottom:1px solid #eee;font-size:13px;}
.table th{background:#fafafa;font-weight:600;color:#666;}
.table tr:hover{background:#fafafa;}
.tag{display:inline-block;padding:3px 8px;border-radius:5px;font-size:11px;font-weight:500;}
.tag-green{background:#e8f5e9;color:#2e7d32;}
.tag-red{background:#ffebee;color:#c62828;}
.tag-orange{background:#fff3e0;color:#e65100;}
.tag-blue{background:#e3f2fd;color:#1565c0;}
.tag-gray{background:#f5f5f5;color:#666;}
.tag-purple{background:#f3e5f5;color:#6a1b9a;}

/* 搜索栏 */
.search-bar{display:flex;gap:10px;margin-bottom:15px;flex-wrap:wrap;}
.search-input{padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-size:13px;outline:none;width:200px;}
.search-input:focus{border-color:#ff6b35;}
.search-select{padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-size:13px;outline:none;}

/* 弹窗 */
.modal-mask{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:#fff;border-radius:15px;padding:25px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;}
.modal h3{margin-bottom:20px;color:#d32f2f;}
.modal-btns{display:flex;gap:10px;margin-top:20px;}
.modal-btns .btn{flex:1;}

/* 桌台网格 */
.table-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:15px;}
.table-card{background:#fff;border-radius:12px;padding:20px;text-align:center;cursor:pointer;transition:all 0.2s;border:2px solid transparent;box-shadow:0 2px 8px rgba(0,0,0,0.05);}
.table-card:hover{transform:translateY(-3px);box-shadow:0 5px 15px rgba(0,0,0,0.1);}
.table-card.free{border-color:#4caf50;}
.table-card.occupied{border-color:#f44336;background:#fff5f5;}
.table-card.ktv{border-color:#9c27b0;}
.table-card.ktv.occupied{background:#faf5ff;}
.table-name{font-size:15px;font-weight:bold;margin-bottom:5px;}
.table-info{font-size:12px;color:#888;}
.table-amount{font-size:14px;color:#f44336;font-weight:bold;margin-top:5px;}
.table-status-tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;margin-top:5px;}
.free .table-status-tag{background:#e8f5e9;color:#2e7d32;}
.occupied .table-status-tag{background:#ffebee;color:#c62828;}

/* 点餐弹窗 */
.order-modal{max-width:900px;display:grid;grid-template-columns:1fr 340px;gap:20px;padding:0;}
.order-dishes{padding:20px;border-right:1px solid #eee;}
.order-cart{padding:20px;background:#fafafa;border-radius:0 15px 15px 0;}
.category-tabs{display:flex;gap:8px;margin-bottom:15px;flex-wrap:wrap;}
.cat-tab{padding:6px 14px;background:#fff;border:1px solid #ddd;border-radius:20px;font-size:12px;cursor:pointer;}
.cat-tab.active{background:#ff6b35;color:#fff;border-color:#ff6b35;}
.dish-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-height:450px;overflow-y:auto;padding-right:10px;}
.dish-item{background:#fff;border:1px solid #eee;border-radius:8px;padding:10px;display:flex;justify-content:space-between;align-items:center;}
.dish-item-name{font-size:13px;font-weight:500;}
.dish-item-price{font-size:12px;color:#f44336;margin-top:3px;}
.dish-add{background:#ff6b35;color:#fff;border:none;width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;}

.cart-title{font-size:15px;font-weight:bold;margin-bottom:15px;display:flex;justify-content:space-between;align-items:center;}
.cart-list{max-height:300px;overflow-y:auto;margin-bottom:15px;}
.cart-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee;}
.cart-item-name{font-size:13px;flex:1;}
.cart-item-price{font-size:13px;color:#f44336;margin-right:10px;}
.cart-qty{display:flex;align-items:center;gap:8px;}
.cart-qty button{width:24px;height:24px;border:1px solid #ddd;background:#fff;border-radius:50%;cursor:pointer;font-size:14px;}
.cart-total{border-top:2px solid #ff6b35;padding-top:15px;}
.cart-total-row{display:flex;justify-content:space-between;margin-bottom:8px;font-size:13px;}
.cart-total-row.big{font-size:18px;font-weight:bold;color:#d32f2f;}

/* 会员充值 */
.recharge-box{background:#f5f5f5;border-radius:10px;padding:15px;margin-bottom:15px;}
.recharge-item{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.recharge-item:last-child{margin-bottom:0;}
.recharge-label{width:80px;font-size:13px;color:#666;}
.recharge-input{flex:1;padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:13px;outline:none;}

/* 响应式 */
@media (max-width: 768px) {
  .sidebar{width:60px;}
  .sidebar-logo h2,.sidebar-logo p,.menu-item span:last-child{display:none;}
  .main{margin-left:60px;}
  .stats-grid{grid-template-columns:repeat(2,1fr);}
  .order-modal{grid-template-columns:1fr;max-width:100%;}
  .order-dishes{border-right:none;border-bottom:1px solid #eee;}
  .order-cart{border-radius:0 0 15px 15px;}
}
</style>
</head>
<body>

<div id="app"></div>

<script>
// ========== Supabase 配置 ==========
const SUPABASE_URL = 'https://ztymkrkfiroqodahxueg.supabase.co';
const SUPABASE_KEY = 'sb_publishable_YlUEDeJVn0DKHipp7373Ng_p4HLDqXV';

const SUPA = {
  async api(path, method = 'GET', body = null) {
    const url = `${SUPABASE_URL}/rest/v1/${path}`;
    const opts = {
      method,
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=representation'
      }
    };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(url, opts);
    if (!res.ok) {
      const text = await res.text();
      throw new Error(`API Error: ${res.status} ${text}`);
    }
    if (res.status === 204) return null;
    return res.json();
  },
  list(table, filter = '') {
    return this.api(`${table}${filter ? '?' + filter : ''}`);
  },
  get(table, id) {
    return this.api(`${table}?id=eq.${id}`).then(r => r[0]);
  },
  create(table, data) {
    return this.api(table, 'POST', data);
  },
  update(table, id, data) {
    return this.api(`${table}?id=eq.${id}`, 'PATCH', data);
  },
  remove(table, id) {
    return this.api(`${table}?id=eq.${id}`, 'DELETE');
  }
};

// ========== 登录状态 ==========
let currentUser = JSON.parse(localStorage.getItem('jf_currentUser') || 'null');

// ========== 页面渲染 ==========
function renderLogin() {
  document.getElementById('app').innerHTML = `
    <div class="login-page">
      <div class="login-box">
        <div class="login-logo">
          <div class="login-logo-icon">🎵</div>
          <div class="login-title">金烽音乐餐吧</div>
          <div class="login-sub">后台管理系统</div>
        </div>
        <div class="form-group">
          <label class="form-label">账号</label>
          <input class="form-input" id="login-user" placeholder="请输入账号" value="admin">
        </div>
        <div class="form-group">
          <label class="form-label">密码</label>
          <input class="form-input" id="login-pass" type="password" placeholder="请输入密码" value="123456">
        </div>
        <button class="btn btn-primary" onclick="doLogin()">登 录</button>
        <p style="text-align:center;color:#aaa;font-size:12px;margin-top:15px;">金烽音乐餐吧 · 内部管理系统</p>
      </div>
    </div>
  `;
  document.getElementById('login-pass').addEventListener('keypress', e => {
    if (e.key === 'Enter') doLogin();
  });
}

async function doLogin() {
  const username = document.getElementById('login-user').value.trim();
  const password = document.getElementById('login-pass').value;
  if (!username || !password) { alert('请输入账号密码！'); return; }

  try {
    const users = await SUPA.list('restaurant_users', `username=eq.${username}`);
    if (users.length === 0) { alert('账号不存在！'); return; }
    const user = users[0];
    if (user.password !== password) { alert('密码错误！'); return; }
    if (user.status !== 'active') { alert('账号已停用！'); return; }

    currentUser = user;
    localStorage.setItem('jf_currentUser', JSON.stringify(user));
    renderApp();
  } catch (e) {
    alert('登录失败：' + e.message);
  }
}

function logout() {
  currentUser = null;
  localStorage.removeItem('jf_currentUser');
  renderLogin();
}

// ========== 主界面 ==========
let currentPage = 'pos';

const menuItems = [
  { id: 'pos', name: '点餐收银', icon: '🍽️' },
  { id: 'orders', name: '订单管理', icon: '📋' },
  { id: 'members', name: '会员管理', icon: '💳' },
  { id: 'employees', name: '员工管理', icon: '👥' },
  { id: 'attendance', name: '考勤管理', icon: '📋' },
  { id: 'dishes', name: '菜品管理', icon: '🍖' },
  { id: 'tables', name: '桌台设置', icon: '🪑' },
  { id: 'stats', name: '数据统计', icon: '📊' },
  { id: 'products', name: '货品管理', icon: '📦' },
  { id: 'stockIn', name: '进货管理', icon: '📥' },
  { id: 'stockOut', name: '出货管理', icon: '📤' },
  { id: 'settings', name: '系统设置', icon: '⚙️' },
];

function renderApp() {
  document.getElementById('app').innerHTML = `
    <div class="app">
      <div class="sidebar">
        <div class="sidebar-logo">
          <h2>🎵 金烽音乐餐吧</h2>
          <p>管理系统</p>
        </div>
        ${menuItems.map(m => `
          <div class="menu-item ${m.id === currentPage ? 'active' : ''}" onclick="switchPage('${m.id}')">
            <span class="menu-icon">${m.icon}</span>
            <span>${m.name}</span>
          </div>
        `).join('')}
      </div>
      <div class="main">
        <div class="topbar">
          <div style="display:flex;align-items:center;gap:15px;">
            <div class="topbar-title" id="page-title">点餐收银</div>
            <a href="index.html" style="text-decoration:none;">
              <span class="tag tag-blue" style="cursor:pointer;font-size:12px;padding:5px 12px;">🏠 返回首页</span>
            </a>
          </div>
          <div class="topbar-user">
            👤 ${currentUser.name || currentUser.username}
            <span onclick="logout()">退出</span>
          </div>
        </div>
        <div class="content" id="content-area"></div>
      </div>
    </div>
  `;
  renderPage();
}

function switchPage(id) {
  currentPage = id;
  document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
  event.currentTarget.classList.add('active');
  const item = menuItems.find(m => m.id === id);
  document.getElementById('page-title').textContent = item.name;
  renderPage();
}

function renderPage() {
  const area = document.getElementById('content-area');
  switch (currentPage) {
    case 'pos': renderPOS(); break;
    case 'orders': renderOrders(); break;
    case 'members': renderMembers(); break;
    case 'employees': renderEmployees(); break;
    case 'attendance': renderAttendance(); break;
    case 'dishes': renderDishes(); break;
    case 'tables': renderTableSettings(); break;
    case 'stats': renderStats(); break;
    case 'products': renderProducts(); break;
    case 'stockIn': renderStockIn(); break;
    case 'stockOut': renderStockOut(); break;
    case 'settings': renderSettings(); break;
  }
}

// ========== 点餐收银 ==========
let currentTable = null;
let cartItems = [];

async function renderPOS() {
  const area = document.getElementById('content-area');
  area.innerHTML = '<div style="text-align:center;padding:30px;">加载中...</div>';

  try {
    const [tables, dishes] = await Promise.all([
      SUPA.list('restaurant_tables', 'order=type.asc,sort.asc'),
      SUPA.list('restaurant_dishes', 'status=eq.on&order=category.asc,sort.asc')
    ]);

    // 统计进行中的订单
    const openOrders = await SUPA.list('restaurant_orders', 'status=eq.open&select=id,table_id,total,order_no');
    const orderMap = {};
    openOrders.forEach(o => { orderMap[o.table_id] = o; });

    area.innerHTML = `
      <div class="card">
        <div class="card-header">
          <div class="card-title">🪑 桌台状态</div>
          <div style="display:flex;gap:8px;">
            <span class="tag tag-green">● 空闲</span>
            <span class="tag tag-red">● 占用</span>
            <span class="tag tag-purple">● KTV</span>
          </div>
        </div>
        <div class="table-grid">
          ${tables.map(t => {
            const isOccupied = !!orderMap[t.id];
            const order = orderMap[t.id];
            const isKTV = t.type === 'ktv';
            return `
              <div class="table-card ${isKTV ? 'ktv' : ''} ${isOccupied ? 'occupied' : 'free'}"
                   onclick="openTable(${t.id}, '${t.name}', ${isKTV}, ${t.hourly_rate || 0})">
                <div class="table-name">${t.name}</div>
                <div class="table-info">${t.capacity}人</div>
                <div class="table-amount">${isOccupied ? '¥' + (order?.total || 0).toFixed(2) : ''}</div>
                <div class="table-status-tag">${isOccupied ? '用餐中' : '空闲'}</div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;

    window._allDishes = dishes;
    window._allTables = tables;
  } catch (e) {
    area.innerHTML = `<div style="text-align:center;padding:30px;color:#f44336;">加载失败：${e.message}</div>`;
  }
}

function openTable(tableId, tableName, isKTV, hourlyRate) {
  currentTable = { id: tableId, name: tableName, isKTV, hourlyRate };
  cartItems = [];
  showOrderModal();
}

function showOrderModal() {
  const dishes = window._allDishes || [];
  const categories = [...new Set(dishes.map(d => d.category))];
  let activeCat = categories[0] || '';

  const modalHtml = `
    <div class="modal-mask" onclick="if(event.target===this)closeOrderModal()">
      <div class="modal order-modal" id="order-modal-box">
        <div class="order-dishes">
          <h3 style="margin-bottom:10px;">🍽️ ${currentTable.name}</h3>
          <div class="category-tabs" id="cat-tabs">
            ${categories.map(c => `
              <div class="cat-tab ${c === activeCat ? 'active' : ''}" onclick="switchCat('${c}')">${c}</div>
            `).join('')}
          </div>
          <div class="dish-list" id="dish-list">
            ${dishes.filter(d => d.category === activeCat).map(d => `
              <div class="dish-item">
                <div>
                  <div class="dish-item-name">${d.name}${d.is_hot ? ' <span style="color:#f44336;font-size:10px;">🔥</span>' : ''}</div>
                  <div class="dish-item-price">¥${d.price}/${d.unit}</div>
                </div>
                <button class="dish-add" onclick="addDishToCart(${d.id}, '${d.name}', ${d.price})">+</button>
              </div>
            `).join('')}
          </div>
        </div>
        <div class="order-cart">
          <div class="cart-title">
            🛒 已点菜品
            <span style="font-size:12px;color:#888;font-weight:normal;" id="cart-count">0 份</span>
          </div>
          <div class="cart-list" id="cart-list">
            <div style="text-align:center;color:#aaa;padding:30px 0;">暂无菜品</div>
          </div>
          <div class="cart-total">
            <div class="cart-total-row"><span>商品合计</span><span id="cart-subtotal">¥0.00</span></div>
            <div class="cart-total-row big"><span>应付金额</span><span id="cart-total">¥0.00</span></div>
          </div>
          <div style="display:flex;gap:8px;margin-top:15px;">
            <button class="btn btn-outline" style="flex:1;" onclick="closeOrderModal()">取消</button>
            <button class="btn btn-primary" style="flex:1;" onclick="submitOrder()">下单结账</button>
          </div>
        </div>
      </div>
    </div>
  `;

  const div = document.createElement('div');
  div.id = 'order-modal';
  div.innerHTML = modalHtml;
  document.body.appendChild(div);
}

function switchCat(cat) {
  document.querySelectorAll('.cat-tab').forEach(el => el.classList.remove('active'));
  event.currentTarget.classList.add('active');
  const dishes = (window._allDishes || []).filter(d => d.category === cat);
  document.getElementById('dish-list').innerHTML = dishes.map(d => `
    <div class="dish-item">
      <div>
        <div class="dish-item-name">${d.name}${d.is_hot ? ' <span style="color:#f44336;font-size:10px;">🔥</span>' : ''}</div>
        <div class="dish-item-price">¥${d.price}/${d.unit}</div>
      </div>
      <button class="dish-add" onclick="addDishToCart(${d.id}, '${d.name}', ${d.price})">+</button>
    </div>
  `).join('');
}

function addDishToCart(id, name, price) {
  const existing = cartItems.find(i => i.dish_id === id);
  if (existing) {
    existing.quantity++;
    existing.amount = existing.price * existing.quantity;
  } else {
    cartItems.push({ dish_id: id, dish_name: name, price, quantity: 1, amount: price });
  }
  updateCartView();
}

function removeDishFromCart(dishId) {
  const idx = cartItems.findIndex(i => i.dish_id === dishId);
  if (idx === -1) return;
  cartItems[idx].quantity--;
  cartItems[idx].amount = cartItems[idx].price * cartItems[idx].quantity;
  if (cartItems[idx].quantity <= 0) cartItems.splice(idx, 1);
  updateCartView();
}

function updateCartView() {
  const listEl = document.getElementById('cart-list');
  if (!listEl) return;

  const totalQty = cartItems.reduce((s, i) => s + i.quantity, 0);
  const subtotal = cartItems.reduce((s, i) => s + i.amount, 0);

  document.getElementById('cart-count').textContent = totalQty + ' 份';
  document.getElementById('cart-subtotal').textContent = '¥' + subtotal.toFixed(2);
  document.getElementById('cart-total').textContent = '¥' + subtotal.toFixed(2);

  if (cartItems.length === 0) {
    listEl.innerHTML = '<div style="text-align:center;color:#aaa;padding:30px 0;">暂无菜品</div>';
  } else {
    listEl.innerHTML = cartItems.map(i => `
      <div class="cart-item">
        <div class="cart-item-name">${i.dish_name}</div>
        <div class="cart-item-price">¥${i.amount.toFixed(2)}</div>
        <div class="cart-qty">
          <button onclick="removeDishFromCart(${i.dish_id})">-</button>
          <span>${i.quantity}</span>
          <button onclick="addDishToCart(${i.dish_id}, '${i.dish_name}', ${i.price})">+</button>
        </div>
      </div>
    `).join('');
  }
}

function closeOrderModal() {
  const m = document.getElementById('order-modal');
  if (m) m.remove();
}

async function submitOrder() {
  if (cartItems.length === 0) { alert('请先点菜品！'); return; }
  if (!confirm(`确认下单？共 ${cartItems.reduce((s,i)=>s+i.quantity,0)} 份，¥${cartItems.reduce((s,i)=>s+i.amount,0).toFixed(2)}`)) return;

  const subtotal = cartItems.reduce((s, i) => s + i.amount, 0);
  const orderNo = 'JF' + Date.now().toString().slice(-10);

  try {
    // 创建订单
    const orders = await SUPA.create('restaurant_orders', {
      order_no: orderNo,
      table_id: currentTable.id,
      table_name: currentTable.name,
      order_type: currentTable.isKTV ? 'ktv' : 'dine_in',
      subtotal: subtotal,
      total: subtotal,
      paid_amount: subtotal,
      pay_method: 'cash',
      status: 'open',
      server_id: currentUser.id,
      server_name: currentUser.name || currentUser.username
    });

    const orderId = orders[0].id;

    // 创建明细
    for (const item of cartItems) {
      await SUPA.create('restaurant_order_items', {
        order_id: orderId,
        dish_id: item.dish_id,
        dish_name: item.dish_name,
        price: item.price,
        quantity: item.quantity,
        amount: item.amount
      });
    }

    // 更新桌台状态
    await SUPA.update('restaurant_tables', currentTable.id, {
      status: 'occupied',
      current_order_id: orderId
    });

    alert('✅ 下单成功！\n订单号：' + orderNo + '\n金额：¥' + subtotal.toFixed(2));
    closeOrderModal();
    renderPOS();
  } catch (e) {
    alert('下单失败：' + e.message);
  }
}

async function payOrder(orderId) {
  if (!confirm('确认此订单已结账？')) return;
  try {
    await SUPA.update('restaurant_orders', orderId, { status: 'paid', close_time: new Date().toISOString() });
    // 释放桌台
    const order = (window._allOrders || []).find(o => o.id === orderId);
    if (order?.table_id) {
      await SUPA.update('restaurant_tables', order.table_id, { status: 'free', current_order_id: null });
    }
    alert('✅ 结账成功！');
    renderOrders();
  } catch (e) {
    alert('操作失败：' + e.message);
  }
}

async function cancelOrder(orderId) {
  if (!confirm('确定作废此订单？')) return;
  try {
    await SUPA.update('restaurant_orders', orderId, { status: 'cancelled', close_time: new Date().toISOString() });
    // 释放桌台
    const order = (window._allOrders || []).find(o => o.id === orderId);
    if (order?.table_id) {
      await SUPA.update('restaurant_tables', order.table_id, { status: 'free', current_order_id: null });
    }
    alert('已作废');
    renderOrders();
  } catch (e) {
    alert('操作失败：' + e.message);
  }
}

function showModalBox(html) {
  const div = document.createElement('div');
  div.id = 'gen-modal';
  div.className = 'modal-mask';
  div.onclick = function(e) { if (e.target === this) closeModal(); };
  div.innerHTML = `<div class="modal">${html}</div>`;
  document.body.appendChild(div);
}

function closeModal() {
  const m = document.getElementById('gen-modal');
  if (m) m.remove();
}

async function doRecharge(memberId) {
  const amount = parseFloat(document.getElementById('r-amount').value);
  const gift = parseFloat(document.getElementById('r-gift').value) || 0;
  const payMethod = document.getElementById('r-pay').value;
  if (!amount || amount <= 0) { alert('请输入充值金额！'); return; }

  const member = (window._allMembers || []).find(m => m.id === memberId);
  const newBalance = (member.balance || 0) + amount + gift;

  try {
    await SUPA.update('restaurant_members', memberId, { balance: newBalance });
    await SUPA.create('restaurant_member_recharges', {
      member_id: memberId,
      member_name: member.name,
      amount,
      gift_amount: gift,
      pay_method: payMethod,
      operator_id: currentUser.id,
      operator_name: currentUser.name || currentUser.username
    });
    alert(`✅ 充值成功！\n\n充值：¥${amount.toFixed(2)}\n赠送：¥${gift.toFixed(2)}\n新余额：¥${newBalance.toFixed(2)}`);

}

// ========== 考勤管理 ==========
let attView = 'month'; // month / year
let attDate = '';
let attEmp = '';

async function renderAttendance() {
  const area = document.getElementById('content-area');
  area.innerHTML = '<div style="text-align:center;padding:30px;">加载中...</div>';

  try {
    const users = await SUPA.list('restaurant_users', 'order=id.asc');
    const today = new Date().toISOString().slice(0,10);
    const y = new Date().getFullYear();
    const m = String(new Date().getMonth() + 1).padStart(2, '0');
    if (!attDate) attDate = attView === 'month' ? `${y}-${m}` : `${y}`;

    // 加载考勤数据
    let startDate, endDate;
    if (attView === 'month') {
      startDate = `${attDate}-01`;
      const lastDay = new Date(attDate + '-01');
      lastDay.setMonth(lastDay.getMonth() + 1);
      lastDay.setDate(0);
      endDate = lastDay.toISOString().slice(0,10);
    } else {
      startDate = `${attDate}-01-01`;
      endDate = `${attDate}-12-31`;
    }

    const allAtt = await SUPA.list('restaurant_attendance',
      `date=gte.${startDate}&date=lte.${endDate}&order=date.desc`);

    // 按员工统计
    const empStats = {};
    users.forEach(u => {
      empStats[u.id] = {
        name: u.name || u.username,
        total: 0, normal: 0, late: 0, early: 0, absent: 0, leave: 0, hours: 0
      };
    });
    allAtt.forEach(a => {
      const s = empStats[a.user_id];
      if (!s) return;
      s.total++;
      s.hours += a.work_hours || 0;
      if (a.status === '正常') s.normal++;
      else if (a.status === '迟到') s.late++;
      else if (a.status === '早退') s.early++;
      else if (a.status === '缺勤') s.absent++;
      else if (a.status === '请假') s.leave++;
    });

    // 总体统计
    const totalDays = allAtt.length;
    const normalDays = allAtt.filter(a => a.status === '正常').length;
    const lateDays = allAtt.filter(a => a.status === '迟到').length;
    const earlyDays = allAtt.filter(a => a.status === '早退').length;
    const absentDays = allAtt.filter(a => a.status === '缺勤').length;
    const leaveDays = allAtt.filter(a => a.status === '请假').length;
    const totalHours = allAtt.reduce((s,a) => s + (a.work_hours||0), 0);

    let filtered = allAtt;
    if (attEmp) filtered = filtered.filter(a => a.user_id == attEmp);

    const title = attView === 'month'
      ? `${attDate} 月考勤统计`
      : `${attDate} 年度考勤统计`;

    area.innerHTML = `
      <div class="stats-grid" style="grid-template-columns:repeat(6,1fr);margin-bottom:15px;">
        <div class="stat-card stat-blue">
          <div class="stat-label">${attView==='month'?'📅 本月出勤':'📅 年度出勤'}</div>
          <div class="stat-value">${totalDays}</div>
          <div class="stat-sub">打卡次数</div>
        </div>
        <div class="stat-card stat-green">
          <div class="stat-label">✅ 正常</div>
          <div class="stat-value">${normalDays}</div>
          <div class="stat-sub">天</div>
        </div>
        <div class="stat-card stat-orange">
          <div class="stat-label">⏰ 迟到</div>
          <div class="stat-value">${lateDays}</div>
          <div class="stat-sub">次</div>
        </div>
        <div class="stat-card stat-purple">
          <div class="stat-label">🚶 早退</div>
          <div class="stat-value">${earlyDays}</div>
          <div class="stat-sub">次</div>
        </div>
        <div class="stat-card" style="background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;">
          <div class="stat-label">❌ 缺勤</div>
          <div class="stat-value">${absentDays}</div>
          <div class="stat-sub">天</div>
        </div>
        <div class="stat-card" style="background:linear-gradient(135deg,#8b5cf6,#7c3aed);color:#fff;">
          <div class="stat-label">⏱️ 总工时</div>
          <div class="stat-value">${totalHours.toFixed(1)}</div>
          <div class="stat-sub">小时</div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title">📊 ${title} - 员工考勤汇总</div>
          <div style="display:flex;gap:8px;">
            <button class="btn ${attView==='month'?'btn-primary':'btn-outline'} btn-small" onclick="attView='month';attDate='';renderAttendance();">当月统计</button>
            <button class="btn ${attView==='year'?'btn-primary':'btn-outline'} btn-small" onclick="attView='year';attDate='';renderAttendance();">年度统计</button>
            <button class="btn btn-warn btn-small" onclick="showAttModal()">+ 新增打卡</button>
          </div>
        </div>

        <div class="search-bar">
          <input class="search-input" placeholder="搜索员工姓名" oninput="filterAttEmpTable(this.value)">
          <select class="search-select" onchange="attEmp=this.value;renderAttendance();">
            <option value="">全部员工</option>
            ${users.map(u => `<option value="${u.id}" ${attEmp==u.id?'selected':''}>${u.name || u.username}</option>`).join('')}
          </select>
          ${attView === 'month'
            ? `<input type="month" class="search-select" value="${attDate}" onchange="attDate=this.value;renderAttendance();">`
            : `<select class="search-select" onchange="attDate=this.value;renderAttendance();">
                ${[y, y-1, y-2].map(y2 => `<option value="${y2}" ${attDate==y2?'selected':''}>${y2}年</option>`).join('')}
              </select>`}
          <button class="btn btn-outline btn-small" onclick="quickCheckIn()">⚡ 快速打卡</button>
        </div>

        <table class="table" id="att-emp-table">
          <thead>
            <tr>
              <th>员工姓名</th>
              <th>出勤天数</th>
              <th>正常</th>
              <th>迟到</th>
              <th>早退</th>
              <th>缺勤</th>
              <th>请假</th>
              <th>总工时</th>
              <th>出勤率</th>
            </tr>
          </thead>
          <tbody>
            ${Object.values(empStats).filter(s => s.total > 0 || !attEmp).map(s => {
              const rate = s.total > 0 ? ((s.normal / s.total) * 100).toFixed(1) : 0;
              return `
              <tr>
                <td><b>${s.name}</b></td>
                <td style="font-weight:bold;">${s.total}</td>
                <td style="color:#22c55e;">${s.normal}</td>
                <td style="color:#f97316;">${s.late}</td>
                <td style="color:#8b5cf6;">${s.early}</td>
                <td style="color:#ef4444;">${s.absent}</td>
                <td style="color:#6b7280;">${s.leave}</td>
                <td>${s.hours.toFixed(1)} h</td>
                <td><span class="tag tag-green">${rate}%</span></td>
              </tr>
              `;
            }).join('') || '<tr><td colspan="9" style="text-align:center;color:#999;padding:30px;">暂无考勤数据</td></tr>'}
          </tbody>
        </table>
      </div>

      <div class="card" style="margin-top:15px;">
        <div class="card-header">
          <div class="card-title">📝 打卡明细 (${filtered.length})</div>
        </div>
        <table class="table" id="att-detail-table">
          <thead>
            <tr>
              <th>日期</th>
              <th>员工</th>
              <th>上班打卡</th>
              <th>下班打卡</th>
              <th>工时</th>
              <th>状态</th>
              <th>备注</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody>
            ${filtered.map(a => `
              <tr>
                <td><b>${a.date}</b></td>
                <td>${a.user_name || '-'}</td>
                <td style="color:#22c55e;">${a.check_in || '-'}</td>
                <td style="color:#f97316;">${a.check_out || '-'}</td>
                <td>${a.work_hours || 0} h</td>
                <td>${statusTag(a.status)}</td>
                <td style="color:#888;font-size:12px;">${a.note || '-'}</td>
                <td>
                  <button class="btn btn-outline btn-small" onclick="editAtt(${a.id})">编辑</button>
                  <button class="btn btn-danger btn-small" onclick="deleteAtt(${a.id})">删除</button>
                </td>
              </tr>
            `).join('') || '<tr><td colspan="8" style="text-align:center;color:#999;padding:30px;">暂无打卡记录</td></tr>'}
          </tbody>
        </table>
      </div>
    `;
    window._allAtt = allAtt;
    window._attUsers = users;
  } catch (e) {
    area.innerHTML = `<div style="text-align:center;padding:30px;color:#f44336;">加载失败：${e.message}</div>`;
  }
}

function statusTag(s) {
  const map = {
    '正常': 'tag-green',
    '迟到': 'tag-orange',
    '早退': 'tag-purple',
    '缺勤': 'tag-red',
    '请假': 'tag-blue'
  };
  return `<span class="tag ${map[s] || 'tag-gray'}">${s || '-'}</span>`;
}

function filterAttEmpTable(keyword) {
  document.querySelectorAll('#att-emp-table tbody tr, #att-detail-table tbody tr').forEach(r => {
    r.style.display = r.textContent.toLowerCase().includes(keyword.toLowerCase()) ? '' : 'none';
  });
}

async function showAttModal(att = null) {
  const users = window._attUsers || await SUPA.list('restaurant_users', 'order=id.asc');
  const a = att || { user_id: currentUser.id, date: new Date().toISOString().slice(0,10),
    check_in: '', check_out: '', status: '正常', note: '' };

  const html = `
    <h3>${att ? '✏️ 编辑打卡' : '➕ 新增打卡'}</h3>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div class="form-group"><label class="form-label">员工 *</label>
        <select class="form-input" id="a-user">
          ${users.map(u => `<option value="${u.id}" ${a.user_id==u.id?'selected':''}>${u.name || u.username}</option>`).join('')}
        </select>
      </div>
      <div class="form-group"><label class="form-label">日期 *</label><input type="date" class="form-input" id="a-date" value="${a.date}"></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div class="form-group"><label class="form-label">上班打卡时间</label><input type="time" class="form-input" id="a-in" value="${a.check_in||''}"></div>
      <div class="form-group"><label class="form-label">下班打卡时间</label><input type="time" class="form-input" id="a-out" value="${a.check_out||''}"></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div class="form-group"><label class="form-label">状态</label>
        <select class="form-input" id="a-status">
          ${['正常','迟到','早退','缺勤','请假'].map(s => `<option ${a.status===s?'selected':''}>${s}</option>`).join('')}
        </select>
      </div>
      <div class="form-group"><label class="form-label">工时（自动）</label><input class="form-input" id="a-hours" readonly style="background:#f3f4f6;"></div>
    </div>
    <div class="form-group"><label class="form-label">备注</label><input class="form-input" id="a-note" value="${a.note||''}"></div>
    <div class="modal-btns">
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveAtt(${att?.id || 'null'})">保存</button>
    </div>
  `;
  showModalBox(html);
  setTimeout(() => {
    const calc = () => {
      const t1 = document.getElementById('a-in').value;
      const t2 = document.getElementById('a-out').value;
      if (t1 && t2) {
        const [h1,m1] = t1.split(':').map(Number);
        const [h2,m2] = t2.split(':').map(Number);
        let h = (h2*60+m2 - h1*60-m1) / 60;
        if (h < 0) h += 24;
        document.getElementById('a-hours').value = h.toFixed(2);
      } else {
        document.getElementById('a-hours').value = '';
      }
    };
    calc();
    document.getElementById('a-in').addEventListener('change', calc);
    document.getElementById('a-out').addEventListener('change', calc);
  }, 100);
}

async function saveAtt(id) {
  const userId = parseInt(document.getElementById('a-user').value);
  const date = document.getElementById('a-date').value;
  if (!userId || !date) { alert('请选择员工和日期！'); return; }

  const checkIn = document.getElementById('a-in').value;
  const checkOut = document.getElementById('a-out').value;
  const hours = parseFloat(document.getElementById('a-hours').value) || 0;

  const user = (window._attUsers || []).find(u => u.id === userId);
  const data = {
    user_id: userId,
    user_name: user ? (user.name || user.username) : '',
    date,
    check_in: checkIn || null,
    check_out: checkOut || null,
    status: document.getElementById('a-status').value,
    work_hours: hours,
    note: document.getElementById('a-note').value
  };

  try {
    if (id) await SUPA.update('restaurant_attendance', id, data);
    else await SUPA.create('restaurant_attendance', data);
    alert('✅ 保存成功！');
    closeModal();
    renderAttendance();
  } catch (e) {
    alert('保存失败：' + e.message);
  }
}

function editAtt(id) {

}

// 快速打卡：当前用户 + 当前时间，直接打上班/下班卡
async function quickCheckIn() {
  const today = new Date().toISOString().slice(0,10);
  const now = new Date().toTimeString().slice(0,5);

  try {
    // 查今天有没有打卡记录
    const existing = await SUPA.list('restaurant_attendance',
      `user_id=eq.${currentUser.id}&date=eq.${today}`);

    if (existing.length === 0) {
      // 上班打卡
      await SUPA.create('restaurant_attendance', {
        user_id: currentUser.id,
        user_name: currentUser.name || currentUser.username,
        date: today,
        check_in: now,
        status: '正常'
      });
      alert(`✅ 上班打卡成功！\n时间：${now}`);
    } else {
      // 下班打卡
      const rec = existing[0];
      const t1 = rec.check_in || now;
      const [h1,m1] = t1.split(':').map(Number);
      const [h2,m2] = now.split(':').map(Number);
      let h = (h2*60+m2 - h1*60-m1) / 60;
      if (h < 0) h += 24;
      await SUPA.update('restaurant_attendance', rec.id, {
        check_out: now,
        work_hours: parseFloat(h.toFixed(2))
      });
      alert(`✅ 下班打卡成功！\n下班：${now}\n工时：${h.toFixed(2)} 小时`);
    }
    renderAttendance();
  } catch (e) {
    alert('打卡失败：' + e.message);
  }
}

// ========== 数据统计 ==========
async function renderStats() {
  const area = document.getElementById('content-area');
  area.innerHTML = '<div style="text-align:center;padding:30px;">加载中...</div>';

  try {
    const today = new Date().toISOString().slice(0, 10);
    const [allOrders, allMembers, allDishes] = await Promise.all([
      SUPA.list('restaurant_orders', 'order=created_at.desc&limit=1000'),
      SUPA.list('restaurant_members', 'select=id'),
      SUPA.list('restaurant_dishes', 'status=eq.on&select=id')
    ]);

    const paidOrders = allOrders.filter(o => o.status === 'paid');
    const todayOrders = paidOrders.filter(o => (o.created_at || '').startsWith(today));
    const todayTotal = todayOrders.reduce((s, o) => s + parseFloat(o.total || 0), 0);
    const todayPeople = todayOrders.reduce((s, o) => s + (o.people_count || 0), 0);
    const totalRevenue = paidOrders.reduce((s, o) => s + parseFloat(o.total || 0), 0);

    // 热销菜品
    const items = await SUPA.list('restaurant_order_items', 'order=amount.desc&limit=50');
    const dishSales = {};
    items.forEach(i => {
      if (!dishSales[i.dish_name]) dishSales[i.dish_name] = { qty: 0, amount: 0 };
      dishSales[i.dish_name].qty += i.quantity;
      dishSales[i.dish_name].amount += parseFloat(i.amount);
    });
    const topDishes = Object.entries(dishSales)
      .sort((a, b) => b[1].amount - a[1].amount)
      .slice(0, 5);

    area.innerHTML = `
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon">💰</div>
          <div class="stat-label">今日营业额</div>
          <div class="stat-value">¥${todayTotal.toFixed(2)}<span class="stat-unit"></span></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">📋</div>
          <div class="stat-label">今日订单</div>
          <div class="stat-value">${todayOrders.length}<span class="stat-unit">单</span></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">👥</div>
          <div class="stat-label">今日客流</div>
          <div class="stat-value">${todayPeople}<span class="stat-unit">人</span></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">💳</div>
          <div class="stat-label">会员总数</div>
          <div class="stat-value">${allMembers.length}<span class="stat-unit">人</span></div>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
        <div class="card">
          <div class="card-title" style="margin-bottom:15px;">📊 总览数据</div>
          <table class="table">
            <tbody>
              <tr><td>累计营业额</td><td style="color:#d32f2f;font-weight:bold;">¥${totalRevenue.toFixed(2)}</td></tr>
              <tr><td>累计订单</td><td>${paidOrders.length} 单</td></tr>
              <tr><td>菜品种类</td><td>${allDishes.length} 道</td></tr>
              <tr><td>进行中订单</td><td><span class="tag tag-orange">${allOrders.filter(o => o.status === 'open').length} 单</span></td></tr>
            </tbody>
          </table>
        </div>

        <div class="card">
          <div class="card-title" style="margin-bottom:15px;">🏆 热销菜品 TOP5</div>
          <table class="table">
            <thead><tr><th>排名</th><th>菜品</th><th>销量</th><th>销售额</th></tr></thead>
            <tbody>
              ${topDishes.map(([name, d], i) => `
                <tr>
                  <td><b style="color:${i < 3 ? '#ff6b35' : '#888'};">${'🥇🥈🥉'.split('')[i] || ('# ' + (i + 1))}</b></td>
                  <td>${name}</td>
                  <td>${d.qty} 份</td>
                  <td style="color:#f44336;">¥${d.amount.toFixed(2)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;
  } catch (e) {
    area.innerHTML = `<div style="text-align:center;padding:30px;color:#f44336;">加载失败：${e.message}</div>`;
  }
}

// ========== 货品管理 ==========
let productCategory = '';

async function renderProducts() {
  const area = document.getElementById('content-area');
  area.innerHTML = '<div style="text-align:center;padding:30px;">加载中...</div>';

  try {
    const products = await SUPA.list('restaurant_products', 'order=sort.asc,id.asc');
    const categories = [...new Set(products.map(p => p.category || '其他'))];
    let filtered = products;
    if (productCategory) filtered = products.filter(p => (p.category || '其他') === productCategory);

    const totalVal = filtered.reduce((s,p) => s + (p.stock||0) * (p.cost_price||0), 0);
    const totalItems = filtered.reduce((s,p) => s + (p.stock||0), 0);

    area.innerHTML = `
      <div class="stats-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:15px;">
        <div class="stat-card stat-blue">
          <div class="stat-label">📦 货品种类</div>
          <div class="stat-value">${products.length}</div>
          <div class="stat-sub">种不同货品</div>
        </div>
        <div class="stat-card stat-green">
          <div class="stat-label">📊 库存总数量</div>
          <div class="stat-value">${totalItems.toFixed(1)}</div>
          <div class="stat-sub">所有货品合计</div>
        </div>
        <div class="stat-card stat-orange">
          <div class="stat-label">💰 库存成本价值</div>
          <div class="stat-value">¥${totalVal.toFixed(2)}</div>
          <div class="stat-sub">成本价计算</div>
        </div>
        <div class="stat-card stat-purple">
          <div class="stat-label">📂 分类数</div>
          <div class="stat-value">${categories.length}</div>
          <div class="stat-sub">个货品分类</div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title">📦 货品管理 (${filtered.length})</div>
          <button class="btn btn-warn btn-small" onclick="showProductModal()">+ 新增货品</button>
        </div>
        <div class="search-bar">
          <input class="search-input" placeholder="搜索货品名称" oninput="filterProductTable(this.value)">
          <select class="search-select" onchange="productCategory=this.value;renderProducts();">
            <option value="">全部分类</option>
            ${categories.map(c => `<option value="${c}" ${productCategory===c?'selected':''}>${c}</option>`).join('')}
          </select>
        </div>
        <table class="table" id="product-table">
          <thead>
            <tr>
              <th>货品名称</th>
              <th>分类</th>
              <th>单位</th>
              <th>成本价</th>
              <th>销售价</th>
              <th>库存</th>
              <th>库存价值</th>
              <th>毛利</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody>
            ${filtered.map(p => {
              const val = (p.stock||0) * (p.cost_price||0);
              const profit = (p.sale_price||0) - (p.cost_price||0);
              const rate = p.sale_price > 0 ? ((profit / p.sale_price) * 100).toFixed(0) : 0;
              const low = (p.stock||0) < 10;
              return `
              <tr>
                <td><b>${p.name}</b></td>
                <td><span class="tag tag-blue">${p.category || '-'}</span></td>
                <td>${p.unit || '个'}</td>
                <td>¥${(p.cost_price||0).toFixed(2)}</td>
                <td style="color:#f97316;">¥${(p.sale_price||0).toFixed(2)}</td>
                <td><b style="color:${low?'#ef4444':'#22c55e'};">${p.stock || 0} ${p.unit||''}</b></td>
                <td>¥${val.toFixed(2)}</td>
                <td>¥${profit.toFixed(2)} <small style="color:#999;">(${rate}%)</small></td>
                <td>
                  <button class="btn btn-outline btn-small" onclick="editProduct(${p.id})">编辑</button>
                  <button class="btn btn-danger btn-small" onclick="deleteProduct(${p.id})">删除</button>
                </td>
              </tr>
              `;
            }).join('') || '<tr><td colspan="9" style="text-align:center;color:#999;padding:30px;">暂无货品，点右上角新增</td></tr>'}
          </tbody>
        </table>
      </div>
    `;
    window._allProducts = products;
  } catch (e) {
    area.innerHTML = `<div style="text-align:center;padding:30px;color:#f44336;">加载失败：${e.message}</div>`;
  }
}

function filterProductTable(keyword) {
  const rows = document.querySelectorAll('#product-table tbody tr');

let stockOutDate = '';

async function renderStockOut() {
  const area = document.getElementById('content-area');
  area.innerHTML = '<div style="text-align:center;padding:30px;">加载中...</div>';

  try {
    const all = await SUPA.list('restaurant_stock', 'order=created_at.desc');
    const records = all.filter(r => r.type === 'out');

    const today = new Date().toISOString().slice(0,10);
    const todayRecords = records.filter(r => (r.created_at || '').slice(0,10) === today);
    const todayAmt = todayRecords.reduce((s,r) => s + (r.total_price||0), 0);
    const todayProfit = todayRecords.reduce((s,r) => s + (r.profit||0), 0);
    const todayCost = todayAmt - todayProfit;

    const totalAmt = records.reduce((s,r) => s + (r.total_price||0), 0);
    const totalProfit = records.reduce((s,r) => s + (r.profit||0), 0);
    const totalCost = totalAmt - totalProfit;
    const profitRate = totalAmt > 0 ? ((totalProfit / totalAmt) * 100).toFixed(1) : 0;

    let filtered = records;
    if (stockOutView === 'today') filtered = todayRecords;
    else if (stockOutDate) filtered = filtered.filter(r => (r.created_at || '').slice(0,10) === stockOutDate);

    const fAmt = filtered.reduce((s,r) => s + (r.total_price||0), 0);
    const fProfit = filtered.reduce((s,r) => s + (r.profit||0), 0);
    const fCost = fAmt - fProfit;

    // 分类统计
    const catStats = {};
    filtered.forEach(r => {
      const c = r.category || '其他';
      if (!catStats[c]) catStats[c] = { amt: 0, profit: 0, count: 0 };
      catStats[c].amt += r.total_price || 0;
      catStats[c].profit += r.profit || 0;
      catStats[c].count += 1;

    area.innerHTML = `
      <div class="stats-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:15px;">
        <div class="stat-card stat-orange">
          <div class="stat-label">📤 今日出货总额</div>

          <div class="stat-sub">${todayRecords.length} 笔</div>

        <div class="stat-card stat-green">
          <div class="stat-label">💰 今日毛利</div>
          <div class="stat-value">¥${todayProfit.toFixed(2)}</div>
          <div class="stat-sub">今日成本 ¥${todayCost.toFixed(2)}</div>
        </div>
        <div class="stat-card stat-blue">
          <div class="stat-label">📦 累计出货总额</div>
          <div class="stat-value">¥${totalAmt.toFixed(2)}</div>
          <div class="stat-sub">共 ${records.length} 笔</div>
        </div>
        <div class="stat-card stat-purple">
          <div class="stat-label">📈 累计毛利率</div>
          <div class="stat-value">${profitRate}%</div>
          <div class="stat-sub">总毛利 ¥${totalProfit.toFixed(2)}</div>
        </div>

        <div class="card-header">

          <div style="display:flex;gap:8px;">

          </div>
        </div>
        <div class="search-bar">
          <input class="search-input" placeholder="搜索物品/去向" oninput="filterStockOutTable(this.value)">
          <input type="date" class="search-select" value="${stockOutDate}" onchange="stockOutDate=this.value;stockOutView='all';renderStockOut();" style="min-width:150px;">
        </div>

        <div style="padding:12px 15px;background:#fffbeb;border-top:1px solid #fde68a;display:grid;grid-template-columns:repeat(4,1fr);gap:15px;font-size:13px;">
          <div>📊 筛选结果：<b>${filtered.length}</b> 笔</div>
          <div>💵 出货金额：<b style="color:#f97316;">¥${fAmt.toFixed(2)}</b></div>
          <div>💸 成本：<b style="color:#6b7280;">¥${fCost.toFixed(2)}</b></div>
          <div>💰 毛利：<b style="color:#22c55e;">¥${fProfit.toFixed(2)}</b></div>
        </div>

        ${Object.keys(catStats).length > 0 ? `

          <div style="display:flex;gap:10px;flex-wrap:wrap;">
            ${Object.entries(catStats).sort((a,b)=>b[1].profit-a[1].profit).map(([cat,s]) => `
              <div style="background:#fff;padding:8px 14px;border-radius:8px;border:1px solid #bbf7d0;font-size:12px;flex:1;min-width:120px;">

              </div>
            `).join('')}
          </div>
        </div>` : ''}

        <table class="table" id="stockout-table">
          <thead>
            <tr>
              <th>物品名称</th>
              <th>分类</th>
              <th>数量</th>
              <th>单价</th>

              return `
              <tr>
                <td><b>${r.item_name}</b></td>
                <td><span class="tag tag-orange">${r.category || '-'}</span></td>
                <td>${r.quantity} ${r.unit || ''}</td>
                <td>¥${(r.unit_price || 0).toFixed(2)}</td>
                <td style="color:#f97316;font-weight:bold;">¥${(r.total_price || 0).toFixed(2)}</td>
                <td style="color:#22c55e;font-weight:bold;">¥${(r.profit || 0).toFixed(2)}</td>
                <td><span class="tag tag-green">${rate}%</span></td>
                <td>${r.supplier || '-'}</td>
                <td>${r.operator_name || '-'}</td>
                <td style="font-size:12px;color:#888;">${new Date(r.created_at).toLocaleString()}</td>
                <td><button class="btn btn-danger btn-small" onclick="deleteStock(${r.id},'out')">删除</button></td>
              </tr>
              `;
            }).join('') || '<tr><td colspan="11" style="text-align:center;color:#999;padding:30px;">暂无出货记录</td></tr>'}
          </tbody>
        </table>
      </div>
    `;
    window._allStockOut = records;
  } catch (e) {
    area.innerHTML = `<div style="text-align:center;padding:30px;color:#f44336;">加载失败：${e.message}</div>`;
  }

function onOutProductChange() {
  const pid = parseInt(document.getElementById('s-product').value);
  const p = (window._productList || []).find(x => x.id === pid);
  if (p) {
    document.getElementById('s-cat').value = p.category || '';

    const unitProfit = (p.sale_price||0) - (p.cost_price||0);
    document.getElementById('s-profit').value = unitProfit.toFixed(2);
    // 触发毛利率计算
    document.getElementById('s-price').dispatchEvent(new Event('input'));
  } else {
    document.getElementById('s-cat').value = '';
    document.getElementById('s-unit').value = '';
    document.getElementById('s-price').value = '';
    document.getElementById('s-profit').value = 0;
  }

// 通用保存/删除
async function saveStock(type) {
  const pid = parseInt(document.getElementById('s-product').value);
  if (!pid) { alert('请选择货品！'); return; }
  const p = (window._productList || []).find(x => x.id === pid);
  if (!p) { alert('未找到货品！'); return; }

  const qty = parseFloat(document.getElementById('s-qty').value);
  if (!qty || qty <= 0) { alert('请填写有效数量！'); return; }

  const unitPrice = parseFloat(document.getElementById('s-price').value) || 0;
  const totalPrice = qty * unitPrice;
  const unitProfit = parseFloat(document.getElementById('s-profit')?.value) || 0;
  const profit = type === 'out' ? unitProfit * qty : 0;

  try {
    // 保存进出货记录
    await SUPA.create('restaurant_stock', {
      type: type,
      product_id: pid,
      item_name: p.name,
      category: p.category,
      quantity: qty,
      unit: p.unit,
      unit_price: unitPrice,
      total_price: totalPrice,
      profit: profit,
      supplier: document.getElementById('s-supplier')?.value || '',
      operator_id: currentUser.id,
      operator_name: currentUser.name || currentUser.username,
      note: document.getElementById('s-note')?.value || ''
    });

    // 更新货品库存
    const newStock = type === 'in' ? (p.stock||0) + qty : (p.stock||0) - qty;
    try {
      await SUPA.update('restaurant_products', pid, { stock: newStock });
    } catch (e) {
      console.warn('库存更新失败', e);
    }

    alert('✅ 保存成功！库存已更新');
    closeModal();
    if (type === 'in') renderStockIn();
    else renderStockOut();
  } catch (e) {
    alert('保存失败：' + e.message);
  }
}

async function deleteStock(id, type) {
  if (!confirm('确定删除这条记录？')) return;
  try {
    await SUPA.remove('restaurant_stock', id);
    if (type === 'in') renderStockIn();
    else renderStockOut();
  } catch (e) {
    alert('删除失败：' + e.message);
  }
}

    renderSettings();
  } catch (e) {
    alert('删除失败：' + e.message);
  }
}

// ========== 搜索过滤 ==========
function filterMembers(keyword) {
  const rows = document.querySelectorAll('#members-table tbody tr');
  keyword = keyword.toLowerCase();
  rows.forEach(r => {
    r.style.display = r.textContent.toLowerCase().includes(keyword) ? '' : 'none';
  });
}

function filterDishes(keyword) {
  const rows = document.querySelectorAll('#dishes-table tbody tr');
  keyword = keyword.toLowerCase();
  rows.forEach(r => {
    r.style.display = r.textContent.toLowerCase().includes(keyword) ? '' : 'none';
  });
}

function filterDishCategory(cat) {
  const rows = document.querySelectorAll('#dishes-table tbody tr');
  rows.forEach(r => {
    r.style.display = !cat || r.cells[1].textContent.includes(cat) ? '' : 'none';
  });
}

function filterOrders(keyword) {
  const rows = document.querySelectorAll('#orders-table tbody tr');
  keyword = keyword.toLowerCase();
  rows.forEach(r => {
    r.style.display = r.textContent.toLowerCase().includes(keyword) ? '' : 'none';
  });
}

function filterOrderStatus(status) {
  const rows = document.querySelectorAll('#orders-table tbody tr');
  rows.forEach(r => {
    r.style.display = !status || r.cells[5].textContent.includes(statusText(status)) ? '' : 'none';
  });
}

function statusText(s) {
  const map = { open: '进行中', paid: '已结账', cancelled: '已作废' };
  return map[s] || s;
}

// ========== 启动 ==========
if (currentUser) {
  renderApp();
} else {
  renderLogin();
}
</script>
